<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Removed redundant JS redirect; handled by vercel.json 301s -->
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FF919D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scripture Habit">
  <meta property="og:site_name" content="Scripture Habit">

  <!-- SEO & Social Meta Tags Fallbacks -->
  <meta name="description" content="Read scriptures daily and connect with friends. Perfect for LDS members studying the Book of Mormon, Bible, and Come, Follow Me. Let's make gospel study a habit you love, together." />
  <meta property="og:title" content="Scripture Habit" />
  <meta property="og:description" content="Read scriptures daily and connect with friends. Perfect for LDS members studying the Book of Mormon, Bible, and Come, Follow Me. Let's make gospel study a habit you love, together." />
  <meta property="og:image" content="https://scripturehabit.app/og-image.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Scripture Habit" />
  <meta name="twitter:description" content="Read scriptures daily and connect with friends. Perfect for LDS members studying the Book of Mormon, Bible, and Come, Follow Me. Let's make gospel study a habit you love, together." />
  <meta name="twitter:image" content="https://scripturehabit.app/og-image.png" />

  <!-- Preconnect (Critical origins) & DNS-Prefetch -->
  <link rel="preconnect" href="https://scripture-habit-auth.firebaseapp.com">
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <!-- Preload Critical Loading Mascot & LCP Hero Image -->
  <link rel="preload" as="image" href="/images/mascot-96.webp" type="image/webp">
  <link rel="preload" as="image" href="/images/mascot.webp" type="image/webp" fetchpriority="high">
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.54);
    }
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(106.37deg, #feac5e 29.63%, #c779d0 51.55%, #4bc0c8 90.85%);
      min-height: 100vh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .LandingPageRoot {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .LandingGlass {
      background: rgba(255, 255, 255, 0.54);
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    .hero-section {
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px 24px;
      max-width: 1200px;
      margin: 0 auto;
      gap: 60px;
    }
    .hero-mascot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      width: 320px;
      flex-shrink: 0;
    }
    .hero-mascot-img {
      width: 200px;
      height: 200px;
      object-fit: contain;
    }
    .mascot-bubble {
      position: relative;
      background: #fff;
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border: 1px solid rgba(102, 126, 234, 0.15);
      margin-bottom: 24px;
      text-align: center;
      max-width: 260px;
    }
    .mascot-bubble-text {
      font-size: 1rem;
      font-weight: 700;
      color: #4c63d2;
      line-height: 1.4;
    }
    .mascot-bubble-tail {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid #fff;
    }
    .hero-content {
      max-width: 600px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hero-title {
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 1.5rem;
      color: #242d49;
    }
    .hero-subtitle {
      font-size: 1.25rem;
      color: #788097;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
  </style>
  <title>Scripture Habit</title>
</head>

<body>
  <div id="root">
    <div class="LandingPageRoot">
      <main class="LandingGlass">
        <header class="hero-section">
          <div class="hero-mascot-container">
            <div class="mascot-bubble">
              <span class="mascot-bubble-text">Let's read together!</span>
              <div class="mascot-bubble-tail"></div>
            </div>
            <img 
              src="/images/mascot.webp" 
              alt="Welcome Bird" 
              class="hero-mascot-img" 
              width="200" 
              height="200"
              fetchpriority="high"
              decoding="async"
            />
          </div>
          <div class="hero-content">
            <h1 class="hero-title">Build a Daily Scripture Habit, Together</h1>
            <p class="hero-subtitle">Connect with friends, track reading streaks, and encourage one another every day.</p>
          </div>
        </header>
      </main>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
