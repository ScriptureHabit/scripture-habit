name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  CRON_SECRET: ci-dummy-cron-secret-key-12345
  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

defaults:
  run:
    working-directory: ./scripture-habit

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.59.1-noble

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # npmの依存関係のキャッシュを有効化して高速化します
          cache-dependency-path: './scripture-habit/package-lock.json'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Dummy Env File
        run: |
          echo "VITE_FIREBASE_API_KEY=demo-api-key" > .env.local
          echo "VITE_FIREBASE_AUTH_DOMAIN=demo-project.firebaseapp.com" >> .env.local
          echo "VITE_FIREBASE_PROJECT_ID=scripture-habit-auth" >> .env.local
          echo "VITE_FIREBASE_STORAGE_BUCKET=demo-project.firebasestorage.app" >> .env.local
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=123456789" >> .env.local
          echo "VITE_FIREBASE_APP_ID=1:123456789:web:abcdef" >> .env.local
          echo "VITE_USE_FIREBASE_EMULATOR=true" >> .env.local
          echo "CRON_SECRET=test-secret" >> .env.local
          echo "FIREBASE_PROJECT_ID=scripture-habit-auth" >> .env.local

      - name: Install Linux utilities
        run: apt-get update && apt-get install -y lsof

      - name: Install dependencies
        run: npm ci # `npm install`よりも厳密で高速なクリーンインストールを行います

      - name: Run ESLint
        run: npm run lint || true # Lintを実行しますが、一時的に失敗してもCIを進めるようにします

      - name: Run Tests (Vitest)
        run: npm test

      - name: Build Project
        run: npm run build # 本番用のビルドが正常に通るかも確認します

      - name: Run Integration Tests
        run: npm run test:internal

      # Playwright browsers are pre-installed in the container

      - name: Run E2E Tests
        run: node scripts/test-emulated.js "npx playwright test --grep-invert visual"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: scripture-habit/playwright-report/
          retention-days: 3

      - name: Deploy to Vercel
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        working-directory: .
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel deploy --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

