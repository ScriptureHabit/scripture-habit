name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  CRON_SECRET: ci-dummy-cron-secret-key-12345

jobs:
  validate:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Quality & Consistency Checks
        run: npm run check:all

      - name: Run Unit Tests (Vitest)
        run: npm test

  integration-and-e2e:
    name: Integration & E2E Tests
    needs: validate
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Dummy Env File
        run: |
          echo "VITE_FIREBASE_API_KEY=demo-api-key" > .env.local
          echo "VITE_FIREBASE_AUTH_DOMAIN=demo-project.firebaseapp.com" >> .env.local
          echo "VITE_FIREBASE_PROJECT_ID=scripture-habit-auth" >> .env.local
          echo "VITE_FIREBASE_STORAGE_BUCKET=demo-project.firebasestorage.app" >> .env.local
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=123456789" >> .env.local
          echo "VITE_FIREBASE_APP_ID=1:123456789:web:abcdef" >> .env.local
          echo "VITE_USE_FIREBASE_EMULATOR=true" >> .env.local
          echo "CRON_SECRET=test-secret" >> .env.local
          echo "FIREBASE_PROJECT_ID=scripture-habit-auth" >> .env.local

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        run: npm run test:internal

      - name: Build Project
        run: npm run build

      - name: Run E2E Tests
        run: npm run test:e2e:ci

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

  deploy:
    name: Deploy to Vercel
    needs: [validate, integration-and-e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull and Deploy to Vercel
        run: |
          npx vercel pull --yes --environment=production
          npx vercel deploy --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
