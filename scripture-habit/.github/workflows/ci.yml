name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Create Dummy Env File
        run: |
          echo "VITE_FIREBASE_API_KEY=demo-api-key" > .env.local
          echo "VITE_FIREBASE_AUTH_DOMAIN=demo-project.firebaseapp.com" >> .env.local
          echo "VITE_FIREBASE_PROJECT_ID=scripture-habit-auth" >> .env.local
          echo "VITE_FIREBASE_STORAGE_BUCKET=demo-project.firebasestorage.app" >> .env.local
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=123456789" >> .env.local
          echo "VITE_FIREBASE_APP_ID=1:123456789:web:abcdef" >> .env.local
          echo "VITE_USE_FIREBASE_EMULATOR=true" >> .env.local
          echo "CRON_SECRET=test-secret" >> .env.local
          echo "FIREBASE_PROJECT_ID=scripture-habit-auth" >> .env.local

      - name: Build Application
        run: npm run build

  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JRE (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Create Dummy Env File
        run: |
          echo "VITE_FIREBASE_API_KEY=demo-api-key" > .env.local
          echo "VITE_FIREBASE_AUTH_DOMAIN=demo-project.firebaseapp.com" >> .env.local
          echo "VITE_FIREBASE_PROJECT_ID=scripture-habit-auth" >> .env.local
          echo "VITE_FIREBASE_STORAGE_BUCKET=demo-project.firebasestorage.app" >> .env.local
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=123456789" >> .env.local
          echo "VITE_FIREBASE_APP_ID=1:123456789:web:abcdef" >> .env.local
          echo "VITE_USE_FIREBASE_EMULATOR=true" >> .env.local
          echo "CRON_SECRET=test-secret" >> .env.local
          echo "FIREBASE_PROJECT_ID=scripture-habit-auth" >> .env.local

      - name: Run Backend Tests
        run: npm run test:internal
        env:
          CRON_SECRET: test-secret
          NODE_ENV: test

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm run test -- --run

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JRE (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Create Dummy Env File
        run: |
          echo "VITE_FIREBASE_API_KEY=demo-api-key" > .env.local
          echo "VITE_FIREBASE_AUTH_DOMAIN=demo-project.firebaseapp.com" >> .env.local
          echo "VITE_FIREBASE_PROJECT_ID=scripture-habit-auth" >> .env.local
          echo "VITE_FIREBASE_STORAGE_BUCKET=demo-project.firebasestorage.app" >> .env.local
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=123456789" >> .env.local
          echo "VITE_FIREBASE_APP_ID=1:123456789:web:abcdef" >> .env.local
          echo "VITE_USE_FIREBASE_EMULATOR=true" >> .env.local
          echo "CRON_SECRET=test-secret" >> .env.local
          echo "FIREBASE_PROJECT_ID=scripture-habit-auth" >> .env.local

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: node scripts/test-emulated.js "npx playwright test --grep-invert visual"
        env:
          CRON_SECRET: test-secret
          NODE_ENV: test
