<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Removed redundant JS redirect; handled by vercel.json 301s -->
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FF919D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scripture Habit">
  <meta property="og:site_name" content="Scripture Habit">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* Immediate paint for app shell */
    .initial-loader {
      background: linear-gradient(106.37deg, #feac5e 29.63%, #c779d0 51.55%, #4bc0c8 90.85%);
      min-height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .loader-logo {
      width: 80px;
      height: 80px;
      opacity: 0.6;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(0.95); opacity: 0.4; }
    }
  </style>
  <title>Scripture Habit</title>
</head>

<body>
  <div id="root">
    <div class="initial-loader">
      <img src="/logo.svg" alt="Loading..." class="loader-logo" />
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
