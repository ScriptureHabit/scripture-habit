<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scripture Habit API Reference (REST API & OpenAPI)</title>
    <meta name="description" content="Interactive OpenAPI documentation and API playground for Scripture Habit backend services." />
    <link rel="icon" href="/favicon.ico" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script
      id="api-reference"
      type="application/json"
      data-url="/openapi.json"
      data-configuration='{
        "theme": "purple",
        "darkMode": true,
        "layout": "modern",
        "showSidebar": true,
        "hideModels": false,
        "searchHotKey": "k"
      }'></script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
